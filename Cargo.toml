[package]
name = "gray-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "gray gateway — always-on daemon: chat apps, cron scheduling, control socket"

[[bin]]
name = "gray-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
cron = "0.12"
env_logger = "0.11"
futures = "0.3"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"
