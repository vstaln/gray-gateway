[package]
name = "gray-gateway"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "gray gateway — always-on daemon: chat channels, cron scheduling, control socket"

[[bin]]
name = "gray-gateway"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
cron = "0.12"
env_logger = "0.11"
futures = "0.3"
futures-util = "0.3"
libc = "0.2"
log = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
qrcode = { version = "0.14", default-features = false }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = "1"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "url"] }
twilight-gateway = "0.17"
twilight-model = "0.17"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "hostname",
  "smtp-transport",
  "tokio1-rustls-tls",
] }
mail-parser = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"
